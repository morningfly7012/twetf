name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/taiwan-etf-calculator-vovz9b
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          exclude_assets: '.github'

      - name: Enable GitHub Pages (serve from gh-pages branch)
        run: |
          api="https://api.github.com/repos/${{ github.repository }}/pages"
          auth="Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}"
          accept="Accept: application/vnd.github+json"

          status=$(curl -s -o /tmp/pages.json -w "%{http_code}" -H "$auth" -H "$accept" "$api")
          echo "GET /pages -> $status"
          cat /tmp/pages.json

          if [ "$status" = "404" ]; then
            echo "Creating Pages site (legacy, gh-pages)"
            curl -s -X POST -H "$auth" -H "$accept" "$api" \
              -d '{"build_type":"legacy","source":{"branch":"gh-pages","path":"/"}}'
          else
            echo "Updating Pages config to legacy gh-pages"
            curl -s -X PUT -H "$auth" -H "$accept" "$api" \
              -d '{"build_type":"legacy","source":{"branch":"gh-pages","path":"/"}}'
          fi

          echo "Requesting a Pages build"
          curl -s -X POST -H "$auth" -H "$accept" "$api/builds"
